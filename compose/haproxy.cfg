global
    log stdout format raw local0
    maxconn 200

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 3s

frontend postgres_primary
    bind "${APP_VM_IP}:5000"
    default_backend patroni_primary

backend patroni_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2
    server pg-node-1 "${PG_NODE_1_IP}:5432" check port 8008
    server pg-node-2 "${PG_NODE_2_IP}:5432" check port 8008
