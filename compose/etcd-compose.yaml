name: ha-etcd

services:
  etcd:
    image: quay.io/coreos/etcd:v3.6.15
    network_mode: host
    restart: unless-stopped
    environment:
      ETCD_NAME: ${ETCD_NAME}
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://${VM_IP}:2379,http://127.0.0.1:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://${VM_IP}:2379
      ETCD_LISTEN_PEER_URLS: http://${VM_IP}:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://${VM_IP}:2380
      ETCD_INITIAL_CLUSTER: ${ETCD_INITIAL_CLUSTER}
      ETCD_INITIAL_CLUSTER_TOKEN: ${ETCD_INITIAL_CLUSTER_TOKEN}
      ETCD_INITIAL_CLUSTER_STATE: ${ETCD_INITIAL_CLUSTER_STATE:-new}
    healthcheck:
      test: [CMD, /usr/local/bin/etcdctl, --endpoints=http://127.0.0.1:2379, endpoint, health]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - etcd-data:/etcd-data
    stop_grace_period: 30s

volumes:
  etcd-data:
    name: ${ETCD_VOLUME_NAME:?Set this VM's etcd volume name}
