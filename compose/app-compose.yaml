name: ha-postgresql

services:
  haproxy:
    image: haproxy:3.4.4-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      APP_VM_IP: ${VM_IP}
      PG_NODE_1_IP: ${PG_NODE_1_IP}
      PG_NODE_2_IP: ${PG_NODE_2_IP}
    configs:
      - source: haproxy
        target: /usr/local/etc/haproxy/haproxy.cfg
    healthcheck:
      test: [CMD, haproxy, -c, -f, /usr/local/etc/haproxy/haproxy.cfg]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: 30s

configs:
  haproxy:
    file: ../config/haproxy.cfg
