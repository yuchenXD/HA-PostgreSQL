name: Publish postgres-patroni

on:
  push:
    branches:
      - main
    paths:
      - image/Dockerfile
      - .github/workflows/publish-postgres-patroni.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-postgres-patroni
  cancel-in-progress: false

env:
  IMAGE_NAME: yuchen1226/postgres-patroni
  IMAGE_TAG: 18.6-patroni4.1.5

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check Docker Hub credential is configured
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Add the DOCKERHUB_TOKEN Actions secret with Docker Hub Read & Write permissions."
            exit 1
          fi

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: yuchen1226
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./image
          file: ./image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published architecture index
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "${IMAGE_NAME}@${IMAGE_DIGEST}" > "$RUNNER_TEMP/postgres-patroni-index.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          index = json.loads((Path(os.environ['RUNNER_TEMP']) / 'postgres-patroni-index.json').read_text())
          platforms = {
              (manifest.get('platform', {}).get('os'), manifest.get('platform', {}).get('architecture'))
              for manifest in index['manifests']
          }
          required = {('linux', 'amd64'), ('linux', 'arm64')}
          if not required.issubset(platforms):
              raise SystemExit(f'Missing required platforms: {required - platforms}')
          print('Published index contains linux/amd64 and linux/arm64.')
          PY

      - name: Smoke test published images
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          index = json.loads((Path(os.environ['RUNNER_TEMP']) / 'postgres-patroni-index.json').read_text())
          script = "import platform, psycopg, patroni.dcs.etcd3; from importlib.metadata import version; assert version('patroni') == '4.1.5'; print(platform.machine(), 'Patroni', version('patroni'), 'psycopg and etcd3: OK')"
          for architecture in ('amd64', 'arm64'):
              manifest = next(
                  item for item in index['manifests']
                  if item.get('platform', {}).get('os') == 'linux'
                  and item.get('platform', {}).get('architecture') == architecture
              )
              # Classic Docker stores only one platform per index digest.
              # Pull each platform's manifest digest to avoid a local cache conflict.
              image = f"{os.environ['IMAGE_NAME']}@{manifest['digest']}"
              subprocess.run([
                  'docker', 'run', '--rm', '--platform', f'linux/{architecture}',
                  '--network', 'none', '--entrypoint', 'python', image, '-c', script,
              ], check=True)
          PY

      - name: Record published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          image = f"{os.environ['IMAGE_NAME']}:{os.environ['IMAGE_TAG']}"
          immutable = f"{os.environ['IMAGE_NAME']}@{os.environ['IMAGE_DIGEST']}"
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(f'Published `{image}` for `linux/amd64` and `linux/arm64`.\n\n')
              summary.write(f'Digest reference: `{immutable}`\n\n')
              summary.write(f'```bash\ndocker pull {image}\n```\n')
          PY
