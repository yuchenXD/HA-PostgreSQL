x-patroni-env: &patroni-env
  PATRONI_SUPERUSER_USERNAME: ${POSTGRES_USER}
  PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
  PATRONI_REPLICATION_USERNAME: ${REPLICATION_USER}
  PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
  PATRONI_RESTAPI_USERNAME: ${PATRONI_USER}
  PATRONI_RESTAPI_PASSWORD: ${PATRONI_PASSWORD}

services:
  pg-node-1:
    build:
      context: .
      dockerfile: patroni/Dockerfile
    image: local/postgres18-patroni:4.1.5
    container_name: postgres-ha-node-1

    environment:
      <<: *patroni-env
      PATRONI_NAME: pg-node-1
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node-1:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node-1:8008

    ports:
      - "5432:5432"
      - "127.0.0.1:8008:8008"

    healthcheck:
      test:
        - CMD
        - /opt/patroni/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

    volumes:
      - primary_data:/var/lib/postgresql
      - ${PITR_BACKUP_ROOT}/wal:/wal-archive
      - ${PITR_BACKUP_ROOT}/base:/pitr-base

    configs:
      - source: patroni_config
        target: /etc/patroni/patroni.yml

    depends_on:
      etcd:
        condition: service_healthy

    stop_grace_period: 60s

    networks:
      - pg-ha-network

  pg-node-2:
    build:
      context: .
      dockerfile: patroni/Dockerfile
    image: local/postgres18-patroni:4.1.5
    container_name: postgres-ha-node-2

    environment:
      <<: *patroni-env
      PATRONI_NAME: pg-node-2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-node-2:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-node-2:8008

    ports:
      - "5433:5432"
      - "127.0.0.1:8009:8008"

    healthcheck:
      test:
        - CMD
        - /opt/patroni/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

    volumes:
      - standby_data:/var/lib/postgresql
      - ${PITR_BACKUP_ROOT}/wal:/wal-archive
      - ${PITR_BACKUP_ROOT}/base:/pitr-base

    configs:
      - source: patroni_config
        target: /etc/patroni/patroni.yml

    depends_on:
      etcd:
        condition: service_healthy
        
    stop_grace_period: 60s

    networks:
      - pg-ha-network

  etcd:
    image: quay.io/coreos/etcd:v3.6.15
    container_name: postgres-ha-etcd-1

    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new

    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 12

    volumes:
      - etcd_data:/etcd-data

    networks:
      - pg-ha-network

  haproxy:
    image: haproxy:3.4.4-alpine
    container_name: postgres-ha-haproxy

    ports:
      - "127.0.0.1:5001:5000"
      - "127.0.0.1:7001:7000"

    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    depends_on:
      pg-node-1:
        condition: service_started
      pg-node-2:
        condition: service_started

    networks:
      - pg-ha-network

configs:
  patroni_config:
    file: ./patroni/patroni.yml

volumes:
  primary_data:
    name: pg-primary-data
  standby_data:
    name: pg-standby-data
  etcd_data:
    name: pg-etcd-data

networks:
  pg-ha-network:
    driver: bridge
