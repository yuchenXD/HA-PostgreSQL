global
    log stdout format raw local0
    maxconn 200

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 3s

resolvers docker
    nameserver docker-dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend postgres_primary
    bind *:5000
    default_backend patroni_primary

backend patroni_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 resolvers docker init-addr libc,none

    server pg-node-1 pg-node-1:5432 check port 8008
    server pg-node-2 pg-node-2:5432 check port 8008

listen statistics
    mode http
    bind *:7000
    stats enable
    stats uri /stats
    stats refresh 5s
